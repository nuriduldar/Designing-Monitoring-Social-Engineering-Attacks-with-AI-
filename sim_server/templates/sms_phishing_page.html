<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Phishing - TEST ENVIRONMENT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
        }
        
        .warning-banner {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(255,107,107,0.3);
        }
        
        .phone-container {
            background: #1a1a1a;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .phone-screen {
            background: white;
            border-radius: 20px;
            padding: 20px;
            min-height: 500px;
        }
        
        .phone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        
        .phone-header h3 {
            font-size: 18px;
            color: #2d3748;
        }
        
        .sms-message {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #2196F3;
        }
        
        .sms-sender {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .sms-text {
            color: #2d3748;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 15px;
        }
        
        .sms-link {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .sms-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }
        
        .test-tag {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            color: #856404;
            padding: 12px;
            border-left: 4px solid #ffc107;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: 600;
            font-size: 12px;
        }
        
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .success-message {
            display: none;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Dashboard</a>
        
        <div class="warning-banner">
            ⚠️ [TEST ENVIRONMENT – DO NOT ENTER REAL CREDENTIALS] ⚠️
        </div>
        
        <div class="phone-container">
            <div class="phone-screen">
                <div class="phone-header">
                    <h3>📱 Messages</h3>
                    <span style="color: #718096; font-size: 12px;">[TEST]</span>
                </div>
                
                <div class="sms-message">
                    <div class="sms-sender">{{ scenario_id }}</div>
                    <div class="sms-text">{{ phishing_text }}</div>
                </div>
                
                <div class="test-tag">
                    ⚠️ TEST ENVIRONMENT: This is a simulated SMS for research purposes only.
                </div>
                
                <a href="#" class="sms-link" onclick="handleClick(); return false;">
                    {{ t('click_here', lang) if lang == 'tr' else 'Open Link →' }}
                </a>
                
                <div class="success-message" id="successMessage">
                    ✓ {{ t('recorded', lang) }}
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleClick() {
            const enterParticipantId = '{{ t("enter_participant_id", lang) }}';
            const participantId = prompt(enterParticipantId, 'participant_001') || 'participant_001';
            const scenarioId = '{{ scenario_id }}';
            const action = 'click';
            const metadata = {
                timestamp: new Date().toISOString(),
                attack_type: 'sms_phishing',
                userAgent: navigator.userAgent,
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                device_type: 'mobile_simulation'
            };
            
            const link = document.querySelector('.sms-link');
            link.style.opacity = '0.7';
            const recordingText = '{{ t("loading", lang) if lang == "tr" else "Recording..." }}';
            link.textContent = recordingText;
            
            fetch('/click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    participant: participantId,
                    scenario: scenarioId,
                    action: action,
                    metadata: metadata
                })
            })
            .then(response => response.json())
            .then(data => {
                const successMsg = document.getElementById('successMessage');
                successMsg.style.display = 'block';
                const recordedText = '{{ t("recorded", lang) }}';
                successMsg.textContent = `✓ ${recordedText}\n${new Date(data.timestamp).toLocaleString()}`;
                
                link.style.opacity = '1';
                const openLinkText = '{{ t("click_here", lang) if lang == "tr" else "Open Link →" }}';
                link.textContent = openLinkText;
            })
            .catch(error => {
                console.error('Error:', error);
                const errorText = '{{ t("error", lang) }}: {{ t("test_environment_warning", lang) if lang == "tr" else "Error recording interaction. This is a TEST ENVIRONMENT." }}';
                alert(errorText);
                link.style.opacity = '1';
                const openLinkText = '{{ t("click_here", lang) if lang == "tr" else "Open Link →" }}';
                link.textContent = openLinkText;
            });
        }
    </script>
</body>
</html>
