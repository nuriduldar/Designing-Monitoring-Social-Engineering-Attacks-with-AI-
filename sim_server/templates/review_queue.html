<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Queue - Human-in-the-Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: transform 0.3s;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
        }
        
        .review-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .review-header h3 {
            color: #2d3748;
            font-size: 20px;
        }
        
        .review-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.pending {
            background: #fed7d7;
            color: #c53030;
        }
        
        .badge.approved {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .badge.rejected {
            background: #fed7d7;
            color: #c53030;
        }
        
        .review-content {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .review-content pre {
            white-space: pre-wrap;
            font-family: inherit;
            line-height: 1.6;
            color: #2d3748;
        }
        
        .safety-check {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .safety-check h4 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .safety-check ul {
            list-style: none;
            padding-left: 0;
        }
        
        .safety-check li {
            padding: 5px 0;
            color: #856404;
        }
        
        .safety-check li:before {
            content: "✓ ";
            color: #48bb78;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-approve {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }
        
        .btn-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72,187,120,0.3);
        }
        
        .btn-reject {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
        }
        
        .btn-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245,101,101,0.3);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
        }
        
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    {% include 'language_selector.html' %}
    <div class="container">
        <div class="header">
            <h1><span>👁️</span> {{ t('review_queue', lang) }}</h1>
            <p style="color: #718096; margin-bottom: 15px;">{{ t('review_approve_reject', lang) }}</p>
            <a href="/" class="back-btn">{{ t('back_to_dashboard', lang) }}</a>
        </div>
        
        <div id="reviewQueue">
            <div class="empty-state">
                <div class="icon">📭</div>
                <h2>{{ t('no_items_review', lang) }}</h2>
                <p>{{ t('all_reviewed', lang) }}</p>
            </div>
        </div>
    </div>
    
    <script>
        // Load blocked outputs and pending reviews
        async function loadReviewQueue() {
            try {
                const response = await fetch('/review/queue/api');
                const data = await response.json();
                
                const queueDiv = document.getElementById('reviewQueue');
                
                if (!data.items || data.items.length === 0) {
                    return; // Keep empty state
                }
                
                const messageText = '{{ t("message", lang) }}';
                const safetyChecklistText = '{{ t("safety_checklist", lang) }}';
                const containsTestTagText = '{{ t("contains_test_tag", lang) }}';
                const noCredentialText = '{{ t("no_credential_requests", lang) }}';
                const appropriateText = '{{ t("appropriate_for_research", lang) }}';
                const flaggedKeywordsText = '{{ t("flagged_keywords", lang) }}';
                const yesText = '{{ t("yes", lang) }}';
                const noText = '{{ t("no", lang) }}';
                const approveText = '{{ t("approve", lang) }}';
                const rejectText = '{{ t("reject", lang) }}';
                
                queueDiv.innerHTML = data.items.map((item, index) => {
                    const hasTestTag = item.text.includes('[TEST ENVIRONMENT]');
                    const hasUnsafeKeywords = item.flagged_keywords && item.flagged_keywords.length > 0;
                    const statusText = item.status || 'pending';
                    const statusDisplay = statusText === 'pending' ? '{{ t("pending", lang) }}' : 
                                         statusText === 'approved' ? '{{ t("approved", lang) }}' : 
                                         '{{ t("rejected", lang) }}';
                    
                    return `
                        <div class="review-item" data-id="${item.id || index}">
                            <div class="review-header">
                                <h3>${messageText} ${index + 1}</h3>
                                <div class="review-meta">
                                    <span class="badge ${item.status || 'pending'}">${statusDisplay}</span>
                                    <span class="badge" style="background: #bee3f8; color: #2c5282;">${item.tone || 'unknown'}</span>
                                    <span class="badge" style="background: #e9d8fd; color: #553c9a;">${item.created_at || 'unknown'}</span>
                                </div>
                            </div>
                            
                            <div class="review-content">
                                <pre>${item.text}</pre>
                            </div>
                            
                            <div class="safety-check">
                                <h4>${safetyChecklistText}</h4>
                                <ul>
                                    <li>${containsTestTagText} ${hasTestTag ? yesText : noText}</li>
                                    <li>${noCredentialText} ${!hasUnsafeKeywords ? yesText : noText}</li>
                                    <li>${appropriateText} ${item.appropriate !== false ? yesText : noText}</li>
                                </ul>
                                ${hasUnsafeKeywords ? `<p style="color: #c53030; margin-top: 10px;"><strong>⚠️ ${flaggedKeywordsText}</strong> ${item.flagged_keywords.join(', ')}</p>` : ''}
                            </div>
                            
                            <div class="action-buttons">
                                <button class="btn btn-approve" onclick="approveMessage(${index}, '${item.id || index}')">
                                    ✓ ${approveText}
                                </button>
                                <button class="btn btn-reject" onclick="rejectMessage(${index}, '${item.id || index}')">
                                    ✗ ${rejectText}
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading review queue:', error);
            }
        }
        
        async function approveMessage(index, itemId) {
            try {
                const response = await fetch('/review/approve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: itemId })
                });
                
                const result = await response.json();
                if (result.status === 'approved') {
                    const approvedText = '{{ t("message_approved", lang) }}';
                    alert(approvedText);
                    loadReviewQueue();
                }
            } catch (error) {
                console.error('Error approving message:', error);
                const errorApprovingText = '{{ t("error_approving", lang) }}';
                alert(errorApprovingText);
            }
        }
        
        async function rejectMessage(index, itemId) {
            const rejectionReasonText = '{{ t("rejection_reason", lang) }}';
            const reason = prompt(rejectionReasonText, '');
            try {
                const response = await fetch('/review/reject', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: itemId, reason: reason })
                });
                
                const result = await response.json();
                if (result.status === 'rejected') {
                    const rejectedText = '{{ t("message_rejected", lang) }}';
                    alert(rejectedText);
                    loadReviewQueue();
                }
            } catch (error) {
                console.error('Error rejecting message:', error);
                const errorRejectingText = '{{ t("error_rejecting", lang) }}';
                alert(errorRejectingText);
            }
        }
        
        // Load on page load
        loadReviewQueue();
        setInterval(loadReviewQueue, 30000); // Refresh every 30 seconds
    </script>
</body>
</html>
